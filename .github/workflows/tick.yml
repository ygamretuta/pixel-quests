# Vercel's free cron only runs once a day, so this pings the app every 30 minutes
# (6:00 AM to 9:59 PM Philippine time) to send quest reminders to the tablet.
name: Quest reminders

on:
  schedule:
    - cron: "*/30 22-23,0-13 * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reminders
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://pixel-quests.vercel.app/api/cron/tick
